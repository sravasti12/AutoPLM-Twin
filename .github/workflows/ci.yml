name: engineering-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked deployment and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify installed imports and public assets outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I - <<'PY'
          import importlib
          from importlib.resources import files
          from pathlib import Path
          from unittest.mock import patch

          for name in ("app", "dashboard", "dashboard.public_workspace", "dashboard.vehicle_workspace"):
              importlib.import_module(name)
          assert files("dashboard").joinpath("theme.css").is_file()
          assert files("dashboard").joinpath("vehicle_component", "index.html").is_file()
          from app.public_samples import load_catalog, load_sample
          for sample in load_catalog().samples:
              load_sample(sample.sample_id)
          from streamlit.testing.v1 import AppTest
          entry = files("dashboard").joinpath("streamlit_app.py")
          with patch("httpx.request", side_effect=AssertionError("Public UI contacted backend")):
              view = AppTest.from_file(Path(str(entry)), default_timeout=60).run()
              assert not view.exception
          print("Installed app/dashboard imports, assets and public startup verified")
          PY
      - name: Save resolved dependency versions
        run: python -m pip freeze > benchmarks/ci-dependencies.txt
      - name: Lint
        run: python -m ruff check app dashboard tests scripts
      - name: Type check
        run: >-
          python -m mypy app/models.py app/mapping.py app/resolution.py app/source_adapters.py
          app/api.py app/repository.py app/review_auth.py app/oidc_auth.py
          app/security_store.py app/execution_security.py
          dashboard/reviewer_login.py dashboard/investigation_workspace.py
      - name: Unit tests without MongoDB
        run: python -m pytest tests/unit -q --tb=short --junitxml=benchmarks/ci-unit-tests.xml
      - name: Start MongoDB with the project Compose configuration
        run: docker compose -p autoplm-ci up -d --wait --wait-timeout 120 mongo
      - name: Verify MongoDB connectivity from the runner
        env:
          AUTOPLM_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          python - <<'PY'
          import os
          from pymongo import MongoClient

          with MongoClient(
              os.environ["AUTOPLM_TEST_MONGODB_URI"],
              serverSelectionTimeoutMS=30000,
              connectTimeoutMS=2000,
          ) as client:
              client.admin.command("ping")
          print("MongoDB is reachable from the GitHub runner")
          PY
      - name: Real MongoDB integration tests
        run: python -m pytest tests/integration -q --tb=short --junitxml=benchmarks/ci-integration-tests.xml
        env:
          AUTOPLM_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - name: Run synthetic benchmark
        run: python -m app.cli benchmark --output benchmarks/ci-results.json
      - name: Capture MongoDB container diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p benchmarks
          docker compose -p autoplm-ci ps --all > benchmarks/ci-mongo-status.txt 2>&1 || true
          docker compose -p autoplm-ci logs --no-color mongo > benchmarks/ci-mongo.log 2>&1 || true
      - name: Stop isolated CI MongoDB
        if: ${{ always() }}
        run: docker compose -p autoplm-ci down --volumes
      - name: Upload diagnostic evidence even when tests fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence
          if-no-files-found: warn
          path: |
            benchmarks/ci-dependencies.txt
            benchmarks/ci-unit-tests.xml
            benchmarks/ci-integration-tests.xml
            benchmarks/ci-results.json
            benchmarks/ci-mongo-status.txt
            benchmarks/ci-mongo.log
