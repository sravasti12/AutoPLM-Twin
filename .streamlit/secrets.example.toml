# Example only. Enter real values in Community Cloud's protected secrets settings.
# Never commit .streamlit/secrets.toml or real client/cookie secrets.
AUTOPLM_ENVIRONMENT = "production"
AUTOPLM_API_URL = "https://YOUR-SERVICE.onrender.com"
AUTOPLM_OIDC_ISSUER = "https://YOUR-TENANT.auth0.com/"
AUTOPLM_OIDC_AUDIENCE = "https://autoplm-api.example"
AUTOPLM_OIDC_CLIENT_ID = "YOUR-STREAMLIT-CLIENT-ID"

[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "" # Generate a strong random secret (at least 32 characters) outside Git.
expose_tokens = ["access"]

[auth.auth0]
client_id = "YOUR-STREAMLIT-CLIENT-ID"
client_secret = "" # Confidential web application secret; Streamlit only, never FastAPI.
server_metadata_url = "https://YOUR-TENANT.auth0.com/.well-known/openid-configuration"

[auth.auth0.authorize_params]
audience = "https://autoplm-api.example"

[auth.auth0.client_kwargs]
scope = "openid profile email autoplm:access"
code_challenge_method = "S256"
token_endpoint_auth_method = "client_secret_basic"
prompt = "select_account"
