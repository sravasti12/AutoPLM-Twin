[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoplm-twin"
version = "0.1.0"
description = "Synthetic automotive migration with deterministic engineering verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pymongo>=4.10,<5", "networkx>=3.4,<4", "langgraph>=0.3,<2",
  "langchain-openai>=0.3,<2", "simpy>=4.1,<5", "packaging>=24",
  "streamlit>=1.42,<2", "plotly>=6,<7", "pandas>=2.2,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mongomock>=4.3,<5", "mypy>=1.15,<2"]

[project.scripts]
autoplm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real, isolated MongoDB instance"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"

